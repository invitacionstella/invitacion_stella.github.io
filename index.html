

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
</head>
<body class="bg-stone-100 min-h-screen flex items-center justify-center font-serif text-gray-700">
    <form class="w-10/12 h-fit bg-white p-8 rounded-3xl shadow-lg">
        <img src="static/images/girnalda.png" alt="girnalda">
        <h2 class="italic tracking-wide text-4xl text-center">Bautizo de Stella</h2>
        <h1 class="font-sanz text-gray-400 text-sm text-center mt-2">Ingresa tus datos para acceder a la invitación</h1>

        <!--Icono izquierdo usuario-->
        <section class="relative mt-6">           
            <i 
                data-lucide="user"
                class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400">
            </i>

            <input
                id="usuario" 
                type="text"
                class="w-full px-3 py-2 font-mono  pl-10 border rounded bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Usuario">
        </section>

        <!--Icono izquierdo contraseña-->
        <section class="relative mt-6">
            <i 
                data-lucide="key-round"
                class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400">
            </i>

            <input
                id="contrasena" 
                type="text"
                class="w-full px-3 py-2 font-mono pl-10 border rounded bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Contraseña">
        </section>

        <section class="flex justify-center mt-4">
            <button id="btn-ingresar" type="button" class="rounded-full font-sanz bg-stone-200 px-10 py-3 flex items-center justify-center text-[22px]">Ingresar</button>
        </section>

    </form>

    <script>
        lucide.createIcons();
    </script>

    <script src="js/app.js"></script>
</body>
</html>
